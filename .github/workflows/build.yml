name: Build

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # the JavaFX tests start the toolkit (Platform.startup): without a display they are skipped
      - name: Build and test
        run: xvfb-run --auto-servernum mvn -B verify
