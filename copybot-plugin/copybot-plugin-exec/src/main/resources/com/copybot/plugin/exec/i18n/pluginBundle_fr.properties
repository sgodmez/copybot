plugin.exec.name=Programmes externes
plugin.exec.description=Lance un programme sur chaque fichier (n\u2019importe quel programme, ou ffmpeg pour compresser les vid\u00e9os, convertir les photos HEIC en JPEG ou faire des miniatures) ; ce qu\u2019il \u00e9crit remplace le contenu.

plugin.exec.exec.process.name=Lancer un programme
plugin.exec.exec.process.description=Lance un programme sur le fichier de chaque \u00e9l\u00e9ment ; le fichier qu\u2019il \u00e9crit ({out}) remplace le contenu. Le programme ne doit pas modifier {in}.
