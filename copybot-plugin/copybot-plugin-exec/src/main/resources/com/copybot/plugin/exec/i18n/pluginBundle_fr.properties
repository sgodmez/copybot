plugin.exec.ffmpeg.video.name=Compresser une vid\u00e9o (ffmpeg)
plugin.exec.ffmpeg.video.description=Transcode chaque vid\u00e9o en MP4 (H.265 par d\u00e9faut) par le processeur ou la carte graphique, r\u00e9duite si demand\u00e9 ; ses m\u00e9tadonn\u00e9es et sa date sont conserv\u00e9es. Les autres fichiers passent inchang\u00e9s.
