plugin.exec.ffmpeg.image.name=Convertir une image en JPEG (ffmpeg)
plugin.exec.ffmpeg.image.description=Convertit chaque photo HEIC (ou les images choisies) en JPEG, r\u00e9duite si demand\u00e9 et remise \u00e0 l\u2019endroit quand ffmpeg le peut (HEIC \u00e0 partir de ffmpeg 7.1 ; pour JPEG, PNG et TIFF, cela d\u00e9pend de la version de ffmpeg). Les donn\u00e9es EXIF ne sont pas recopi\u00e9es : le JPEG porte la date de prise de vue quand elle est connue. Les autres fichiers passent inchang\u00e9s.
plugin.exec.ffmpeg.image.config.quality.name=Qualit\u00e9 JPEG
plugin.exec.ffmpeg.image.config.quality.description=De 1 (fichier le plus petit) \u00e0 100 (meilleure image)
plugin.exec.ffmpeg.image.config.maxSize.name=Taille maximale
plugin.exec.ffmpeg.image.config.maxSize.description=En pixels (ex. 2048), du grand c\u00f4t\u00e9 : une image plus grande est r\u00e9duite, ses proportions gard\u00e9es ; jamais agrandie. Vide : pas de r\u00e9duction.
plugin.exec.ffmpeg.image.config.onlyExtensions.name=Extensions converties
plugin.exec.ffmpeg.image.config.onlyExtensions.description=Une par ligne, parmi heic, heif, avif, png, webp, tif, tiff, bmp, jpg et jpeg. Vide : heic et heif. HEIC demande ffmpeg 7.1 ou plus r\u00e9cent.
plugin.exec.ffmpeg.image.config.timeoutSeconds.name=D\u00e9lai (secondes)
plugin.exec.ffmpeg.image.config.timeoutSeconds.description=Pour une image ; au-del\u00e0, ffmpeg est arr\u00eat\u00e9 et l\u2019\u00e9l\u00e9ment est en erreur. 0 : sans limite.
plugin.exec.ffmpeg.image.config.ffmpegPath.name=Chemin de ffmpeg
plugin.exec.ffmpeg.image.config.ffmpegPath.description=Le ffmpeg \u00e0 utiliser : son chemin, ou son nom dans le PATH. Vide : la copie t\u00e9l\u00e9charg\u00e9e, sinon ffmpeg du PATH.
plugin.exec.ffmpeg.image.config.downloadFfmpeg.name=T\u00e9l\u00e9charger ffmpeg s\u2019il est introuvable
plugin.exec.ffmpeg.image.config.downloadFfmpeg.description=Windows x64 : t\u00e9l\u00e9charge la compilation GPL de BtbN/FFmpeg-Builds (environ 200 Mo) quand le premier fichier en a besoin

plugin.exec.ffmpeg.thumbnail.name=Faire une miniature (ffmpeg)
plugin.exec.ffmpeg.thumbnail.description=Fait un petit JPEG de chaque image ou vid\u00e9o, nomm\u00e9 avec -thumb (photo-thumb.jpg), ou -video-thumb pour une vid\u00e9o (clip-video-thumb.jpg) qui donne son image \u00e0 un dixi\u00e8me de sa dur\u00e9e (au plus 10 s). Les autres fichiers sont \u00e9cart\u00e9s.
