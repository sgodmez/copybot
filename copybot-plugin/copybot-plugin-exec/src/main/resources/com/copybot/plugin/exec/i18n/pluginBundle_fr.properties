plugin.exec.ffmpeg.video.config.ffmpegPath.description=Le ffmpeg \u00e0 utiliser : son chemin, ou son nom dans le PATH. Vide : la copie t\u00e9l\u00e9charg\u00e9e, sinon ffmpeg du PATH.
