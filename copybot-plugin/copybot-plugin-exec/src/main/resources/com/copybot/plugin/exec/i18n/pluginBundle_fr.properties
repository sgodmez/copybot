plugin.exec.ffmpeg.video.config.quality.description=Haute : fichiers plus gros ; petit fichier : perte visible
plugin.exec.ffmpeg.video.config.quality.value.high=Haute
plugin.exec.ffmpeg.video.config.quality.value.medium=Moyenne
plugin.exec.ffmpeg.video.config.quality.value.small=Petit fichier
plugin.exec.ffmpeg.video.config.maxHeight.name=Hauteur maximale
plugin.exec.ffmpeg.video.config.maxHeight.description=En pixels (ex. 1080), de la vid\u00e9o telle qu\u2019elle s\u2019affiche (une vid\u00e9o en portrait aussi : sa hauteur est alors son grand c\u00f4t\u00e9) : une vid\u00e9o plus haute est r\u00e9duite, ses proportions gard\u00e9es ; jamais agrandie. Vide : pas de r\u00e9duction.
