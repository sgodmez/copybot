plugin.exec.exec.process.config.timeoutSeconds.description=Pour un \u00e9l\u00e9ment ; au-del\u00e0, le programme est arr\u00eat\u00e9 et l\u2019\u00e9l\u00e9ment est en erreur. 0 : sans limite.

