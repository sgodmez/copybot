plugin.exec.name=Programmes externes
plugin.exec.description=Lance le programme de votre choix sur chaque fichier ; ce qu\u2019il \u00e9crit remplace le contenu.

plugin.exec.exec.process.name=Lancer un programme
plugin.exec.exec.process.description=Lance un programme sur le fichier de chaque \u00e9l\u00e9ment ; le fichier qu\u2019il \u00e9crit ({out}) remplace le contenu. Le programme ne doit pas modifier {in}.
plugin.exec.exec.process.config.program.name=Programme
plugin.exec.exec.process.config.program.description=L\u2019ex\u00e9cutable : son chemin, ou son nom s\u2019il est dans le PATH
plugin.exec.exec.process.config.arguments.name=Arguments
plugin.exec.exec.process.config.arguments.description=Un par ligne ; {in} le fichier \u00e0 lire, {out} le fichier que le programme doit \u00e9crire, {name} le nom sans extension, {ext} l\u2019extension. ${secret:nom} et ${env:NOM} sont remplac\u00e9s.
plugin.exec.exec.process.config.outputExtension.name=Extension produite
plugin.exec.exec.process.config.outputExtension.description=L\u2019extension du fichier \u00e9crit par le programme (ex. jpg) ; vide : celle de l\u2019\u00e9l\u00e9ment
plugin.exec.exec.process.config.successCodes.name=Codes de succ\u00e8s
plugin.exec.exec.process.config.successCodes.description=Les codes de retour d\u2019un succ\u00e8s ; vide : 0
plugin.exec.exec.process.config.timeoutSeconds.name=D\u00e9lai (secondes)
plugin.exec.exec.process.config.timeoutSeconds.description=Pour un \u00e9l\u00e9ment ; au-del\u00e0, le programme est arr\u00eat\u00e9 et l\u2019\u00e9l\u00e9ment est en erreur. 0 : sans limite.

plugin.exec.exec.warning.no-out=exec.process : {out} ne figure dans aucun argument, alors que le programme doit \u00e9crire le fichier nomm\u00e9 par {out}
plugin.exec.exec.error.program-missing=exec.process : le programme n\u2019est pas indiqu\u00e9
plugin.exec.exec.error.not-found={0} est introuvable (ni un fichier ni un programme du PATH)
plugin.exec.exec.error.batch={0} est un fichier de commandes (.bat, .cmd) : non pris en charge, car cmd.exe peut mal lire les noms de fichiers contenant & ou % ; lancez plut\u00f4t le programme qu''il appelle
plugin.exec.exec.error.start={0} ne peut pas \u00eatre lanc\u00e9 : {1}
plugin.exec.exec.error.timeout={0} a \u00e9t\u00e9 arr\u00eat\u00e9 : d\u00e9lai de {1} s d\u00e9pass\u00e9
plugin.exec.exec.error.code={0} s''est termin\u00e9 avec le code {1}
plugin.exec.exec.error.code-stderr={0} s''est termin\u00e9 avec le code {1} : {2}
plugin.exec.exec.error.no-output={0} n''a \u00e9crit aucun fichier, ou un fichier vide
plugin.exec.exec.error.no-output-stderr={0} n''a \u00e9crit aucun fichier, ou un fichier vide : {1}
plugin.exec.exec.error.io={0}, {1} : erreur de fichier de travail ({2})
