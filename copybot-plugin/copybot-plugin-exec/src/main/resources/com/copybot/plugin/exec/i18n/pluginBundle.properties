plugin.exec.name=External programs
plugin.exec.description=Runs a program on each file (any program, or ffmpeg to compress videos, turn HEIC photos into JPEG or make thumbnails); what it writes replaces the content.

plugin.exec.exec.process.name=Run a program
plugin.exec.exec.process.description=Runs a program on the file of each item; the file it writes ({out}) replaces the content. The program must not modify {in}.
plugin.exec.exec.process.config.program.name=Program
plugin.exec.exec.process.config.program.description=The executable: its path, or its name when it is in the PATH
plugin.exec.exec.process.config.arguments.name=Arguments
plugin.exec.exec.process.config.arguments.description=One per line; {in} the file to read, {out} the file the program must write, {name} the name without extension, {ext} the extension. ${secret:name} and ${env:NAME} are replaced.
plugin.exec.exec.process.config.outputExtension.name=Output extension
plugin.exec.exec.process.config.outputExtension.description=The extension of the file the program writes (e.g. jpg); empty: the extension of the item
plugin.exec.exec.process.config.successCodes.name=Success codes
plugin.exec.exec.process.config.successCodes.description=The exit codes of a success; empty: 0
plugin.exec.exec.process.config.timeoutSeconds.name=Time limit (seconds)
plugin.exec.exec.process.config.timeoutSeconds.description=For one item; beyond it the program is stopped and the item is in error. 0: no limit.

plugin.exec.exec.warning.no-out=exec.process: {out} is in none of the arguments, while the program must write the file named by {out}
plugin.exec.exec.error.program-missing=exec.process: the program is missing
plugin.exec.exec.error.not-found={0} is not found (neither a file nor a program of the PATH)
plugin.exec.exec.error.batch={0} is a batch file (.bat, .cmd): not supported, since cmd.exe may misread file names holding & or %; run the program it calls instead
plugin.exec.exec.error.start={0} cannot be started: {1}
plugin.exec.exec.error.timeout={0} was stopped: time limit of {1} s exceeded
plugin.exec.exec.error.code={0} ended with code {1}
plugin.exec.exec.error.code-stderr={0} ended with code {1}: {2}
plugin.exec.exec.error.no-output={0} wrote no file, or an empty one
plugin.exec.exec.error.no-output-stderr={0} wrote no file, or an empty one: {1}
plugin.exec.exec.error.io={0}, {1}: working file error ({2})

plugin.exec.ffmpeg.path-not-found={0} is not found (the ffmpeg path of the action): neither a file nor a program of the PATH
plugin.exec.ffmpeg.not-found.download=ffmpeg is not found: tick \u201cDownload ffmpeg if it is not found\u201d, give its path, or install it in the PATH
plugin.exec.ffmpeg.not-found.install=ffmpeg is not found: install it (apt install ffmpeg, brew install ffmpeg, or from ffmpeg.org) or give its path
plugin.exec.ffmpeg.will-download=ffmpeg is not found: it will be downloaded when the first file needs it (about 200 MB, the GPL build of BtbN/FFmpeg-Builds)
plugin.exec.ffmpeg.download.status=Downloading ffmpeg
plugin.exec.ffmpeg.error.start={0} cannot be started: {1}
plugin.exec.ffmpeg.error.version={0} does not give its version ({1})
plugin.exec.ffmpeg.download.error.no-archive=The download of ffmpeg failed: no Windows build in the release
plugin.exec.ffmpeg.download.error.http=The download of ffmpeg failed: HTTP {0} for {1}
plugin.exec.ffmpeg.download.error.network=The download of ffmpeg failed: {0}
plugin.exec.ffmpeg.download.error.stalled=The download of ffmpeg failed: nothing received for {0} s
plugin.exec.ffmpeg.download.error.too-large=The download of ffmpeg failed: {0} is larger than expected
plugin.exec.ffmpeg.download.error.digest=The download of ffmpeg failed: {0} does not match its SHA-256 fingerprint, it is not installed
plugin.exec.ffmpeg.download.error.archive=The download of ffmpeg failed: the archive {0} is not valid ({1}), it is not installed
plugin.exec.ffmpeg.download.error.io=ffmpeg could not be installed in {0}: {1}
plugin.exec.ffmpeg.download.error.space=ffmpeg cannot be downloaded into {0}: {1} MB of free space needed, {2} MB available

plugin.exec.ffmpeg.video.name=Compress a video (ffmpeg)
plugin.exec.ffmpeg.video.description=Transcodes each video into an MP4 (H.265 by default) by the processor or the graphics card, reduced if asked; its metadata and date are kept. The other files pass unchanged.
plugin.exec.ffmpeg.video.config.codec.name=Codec
plugin.exec.ffmpeg.video.config.codec.description=H.265 (smaller, read by recent devices) or H.264 (read everywhere)
plugin.exec.ffmpeg.video.config.codec.value.h265=H.265 (HEVC)
plugin.exec.ffmpeg.video.config.codec.value.h264=H.264 (AVC)
plugin.exec.ffmpeg.video.config.quality.name=Quality
plugin.exec.ffmpeg.video.config.quality.description=High: larger files; small: smaller files, visible loss
plugin.exec.ffmpeg.video.config.quality.value.high=High
plugin.exec.ffmpeg.video.config.quality.value.medium=Medium
plugin.exec.ffmpeg.video.config.quality.value.small=Small file
plugin.exec.ffmpeg.video.config.maxHeight.name=Maximum height
plugin.exec.ffmpeg.video.config.maxHeight.description=In pixels (e.g. 1080), of the video as it is shown (a portrait video too: its height is then its long side): a higher video is reduced, its ratio kept; never enlarged. Empty: not reduced.
plugin.exec.ffmpeg.video.config.audio.name=Audio
plugin.exec.ffmpeg.video.config.audio.description=AAC at 160 kb/s, or the audio copied as it is
plugin.exec.ffmpeg.video.config.audio.value.aac=AAC 160 kb/s
plugin.exec.ffmpeg.video.config.audio.value.copy=Copied as it is
plugin.exec.ffmpeg.video.config.encoder.name=Encoder
plugin.exec.ffmpeg.video.config.encoder.description=Automatic: the first graphics card encoder that works here, else the processor. A card encoder that does not work is replaced by the processor.
plugin.exec.ffmpeg.video.config.encoder.value.auto=Automatic
plugin.exec.ffmpeg.video.config.encoder.value.cpu=Processor (x265/x264)
plugin.exec.ffmpeg.video.config.encoder.value.nvenc=NVIDIA (NVENC)
plugin.exec.ffmpeg.video.config.encoder.value.qsv=Intel (Quick Sync)
plugin.exec.ffmpeg.video.config.encoder.value.amf=AMD (AMF)
plugin.exec.ffmpeg.video.config.encoder.value.videotoolbox=Apple (VideoToolbox)
plugin.exec.ffmpeg.video.config.encoder.value.vaapi=Linux (VA-API)
plugin.exec.ffmpeg.video.config.timeoutSeconds.name=Time limit (seconds)
plugin.exec.ffmpeg.video.config.timeoutSeconds.description=For one video; beyond it ffmpeg is stopped and the item is in error. A long 4K video encoded by the processor may need more. 0: no limit.
plugin.exec.ffmpeg.video.config.ffmpegPath.name=ffmpeg path
plugin.exec.ffmpeg.video.config.ffmpegPath.description=The ffmpeg to use: its path, or its name in the PATH. Empty: the downloaded copy, else ffmpeg of the PATH.
plugin.exec.ffmpeg.video.config.downloadFfmpeg.name=Download ffmpeg if it is not found
plugin.exec.ffmpeg.video.config.downloadFfmpeg.description=Windows x64: downloads the GPL build of BtbN/FFmpeg-Builds (about 200 MB) when the first file needs it
plugin.exec.ffmpeg.video.error.unknown=ffmpeg.video: unknown {0} \u201c{1}\u201d
plugin.exec.ffmpeg.video.error.timeout=ffmpeg.video: ffmpeg was stopped on {0}: time limit of {1} s exceeded
plugin.exec.ffmpeg.video.error.code=ffmpeg.video: ffmpeg failed on {0} (code {1})
plugin.exec.ffmpeg.video.error.code-stderr=ffmpeg.video: ffmpeg failed on {0} (code {1}): {2}
plugin.exec.ffmpeg.video.error.no-output=ffmpeg.video: ffmpeg wrote no file, or an empty one, for {0}
plugin.exec.ffmpeg.video.error.io=ffmpeg.video: {0}: working file error ({1})

plugin.exec.ffmpeg.image.name=Convert an image into JPEG (ffmpeg)
plugin.exec.ffmpeg.image.description=Converts each HEIC photo (or the chosen images) into a JPEG, reduced if asked and turned upright when ffmpeg can (HEIC from ffmpeg 7.1; for JPEG, PNG and TIFF it depends on the ffmpeg build). The EXIF data is not copied: the JPEG is dated by the capture date when it is known. The other files pass unchanged.
plugin.exec.ffmpeg.image.config.quality.name=JPEG quality
plugin.exec.ffmpeg.image.config.quality.description=From 1 (smallest file) to 100 (best picture)
plugin.exec.ffmpeg.image.config.maxSize.name=Maximum size
plugin.exec.ffmpeg.image.config.maxSize.description=In pixels (e.g. 2048), of the long side: a larger image is reduced, its proportions kept; never enlarged. Empty: not reduced.
plugin.exec.ffmpeg.image.config.onlyExtensions.name=Extensions converted
plugin.exec.ffmpeg.image.config.onlyExtensions.description=One per line, among heic, heif, avif, png, webp, tif, tiff, bmp, jpg and jpeg. Empty: heic and heif. HEIC needs ffmpeg 7.1 or later.
plugin.exec.ffmpeg.image.config.timeoutSeconds.name=Time limit (seconds)
plugin.exec.ffmpeg.image.config.timeoutSeconds.description=For one image; beyond it ffmpeg is stopped and the item is in error. 0: no limit.
plugin.exec.ffmpeg.image.config.ffmpegPath.name=ffmpeg path
plugin.exec.ffmpeg.image.config.ffmpegPath.description=The ffmpeg to use: its path, or its name in the PATH. Empty: the downloaded copy, else ffmpeg of the PATH.
plugin.exec.ffmpeg.image.config.downloadFfmpeg.name=Download ffmpeg if it is not found
plugin.exec.ffmpeg.image.config.downloadFfmpeg.description=Windows x64: downloads the GPL build of BtbN/FFmpeg-Builds (about 200 MB) when the first file needs it

plugin.exec.ffmpeg.thumbnail.name=Make a thumbnail (ffmpeg)
plugin.exec.ffmpeg.thumbnail.description=Makes a small JPEG of each image or video, named with -thumb (photo-thumb.jpg), or -video-thumb for a video (clip-video-thumb.jpg), which gives its picture at a tenth of its length (at most 10 s). The other files are left out.
plugin.exec.ffmpeg.thumbnail.config.size.name=Size
plugin.exec.ffmpeg.thumbnail.config.size.description=In pixels, of the long side of the thumbnail; a smaller picture is not enlarged
plugin.exec.ffmpeg.thumbnail.config.timeoutSeconds.name=Time limit (seconds)
plugin.exec.ffmpeg.thumbnail.config.timeoutSeconds.description=For one file; beyond it ffmpeg is stopped and the item is in error. 0: no limit.
plugin.exec.ffmpeg.thumbnail.config.ffmpegPath.name=ffmpeg path
plugin.exec.ffmpeg.thumbnail.config.ffmpegPath.description=The ffmpeg to use: its path, or its name in the PATH. Empty: the downloaded copy, else ffmpeg of the PATH.
plugin.exec.ffmpeg.thumbnail.config.downloadFfmpeg.name=Download ffmpeg if it is not found
plugin.exec.ffmpeg.thumbnail.config.downloadFfmpeg.description=Windows x64: downloads the GPL build of BtbN/FFmpeg-Builds (about 200 MB) when the first file needs it

