plugin.notify-email.name=E-mail notification
plugin.notify-email.description=Sends the result of a run by e-mail at its end (SMTP).

plugin.notify-email.email.send.name=Send an e-mail
plugin.notify-email.email.send.description=Sends the result of the run by e-mail (SMTP) when it ends: outcome, duration, counts, created folders, published values, warnings and the items in error. A failure is a warning of the run.
