plugin.gps-zone.name=V\u00e9rification du fuseau par GPS
plugin.gps-zone.description=Rep\u00e8re les photos d'un appareil mal r\u00e9gl\u00e9 gr\u00e2ce \u00e0 leur position GPS. Fronti\u00e8res de fuseaux de Timezone Boundary Builder (ODbL), via https://github.com/RomanIakovlev/timeshape.

plugin.gps-zone.check.name=V\u00e9rifie le fuseau avec le GPS
plugin.gps-zone.check.description=\u00c0 placer apr\u00e8s l'extraction des m\u00e9tadonn\u00e9es : propose le fuseau du lieu pour une photo dont le d\u00e9calage not\u00e9 en diff\u00e8re, quand son heure GPS confirme la date de prise.
