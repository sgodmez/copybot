plugin.gps-zone.name=GPS time zone check
plugin.gps-zone.description=Tells the photos whose camera was badly set from their GPS position. Time zone boundaries of Timezone Boundary Builder (ODbL), through https://github.com/RomanIakovlev/timeshape.

plugin.gps-zone.check.name=Check the time zone with the GPS
plugin.gps-zone.check.description=To place after the metadata extraction: suggests the time zone of the place for a photo whose recorded offset differs from it, when its GPS time confirms the capture date.
