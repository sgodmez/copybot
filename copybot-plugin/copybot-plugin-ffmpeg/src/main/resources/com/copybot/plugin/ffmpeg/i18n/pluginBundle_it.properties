plugin.ffmpeg.ffmpeg.image.name=Converti un\u2019immagine in JPEG (ffmpeg)
plugin.ffmpeg.ffmpeg.image.description=Converte ogni foto HEIC (o le immagini scelte) in JPEG, ridotta se richiesto e raddrizzata quando ffmpeg ci riesce (HEIC da ffmpeg 7.1; per JPEG, PNG e TIFF dipende dalla versione di ffmpeg). I dati EXIF non vengono copiati: il JPEG porta la data di scatto quando \u00e8 nota. Gli altri file passano invariati.
plugin.ffmpeg.ffmpeg.image.config.quality.name=Qualit\u00e0 JPEG
plugin.ffmpeg.ffmpeg.image.config.quality.description=Da 1 (file pi\u00f9 piccolo) a 100 (immagine migliore)
plugin.ffmpeg.ffmpeg.image.config.maxSize.name=Dimensione massima
plugin.ffmpeg.ffmpeg.image.config.maxSize.description=In pixel (es. 2048), del lato lungo: un\u2019immagine pi\u00f9 grande viene ridotta, mantenendo le proporzioni; mai ingrandita. Vuoto: nessuna riduzione.
plugin.ffmpeg.ffmpeg.image.config.onlyExtensions.name=Estensioni convertite
plugin.ffmpeg.ffmpeg.image.config.onlyExtensions.description=Una per riga, tra heic, heif, avif, png, webp, tif, tiff, bmp, jpg e jpeg. Vuoto: heic e heif. HEIC richiede ffmpeg 7.1 o successivo.
plugin.ffmpeg.ffmpeg.image.config.timeoutSeconds.name=Limite di tempo (secondi)
plugin.ffmpeg.ffmpeg.image.config.timeoutSeconds.description=Per un\u2019immagine; oltre, ffmpeg viene fermato e l\u2019elemento \u00e8 in errore. 0: nessun limite.
plugin.ffmpeg.ffmpeg.image.config.ffmpegPath.name=Percorso di ffmpeg
plugin.ffmpeg.ffmpeg.image.config.ffmpegPath.description=Il ffmpeg da usare: il suo percorso, o il suo nome nel PATH. Vuoto: la copia scaricata, altrimenti ffmpeg del PATH.
plugin.ffmpeg.ffmpeg.image.config.downloadFfmpeg.name=Scarica ffmpeg se non viene trovato
plugin.ffmpeg.ffmpeg.image.config.downloadFfmpeg.description=Windows x64: scarica la build GPL di BtbN/FFmpeg-Builds (circa 200 MB) quando il primo file ne ha bisogno

plugin.ffmpeg.ffmpeg.thumbnail.name=Crea una miniatura (ffmpeg)
plugin.ffmpeg.ffmpeg.thumbnail.description=Crea un piccolo JPEG di ogni immagine o video, chiamato con -thumb (photo-thumb.jpg), o -video-thumb per un video (clip-video-thumb.jpg) che d\u00e0 la sua immagine a un decimo della durata (al massimo 10 s). Gli altri file vengono esclusi.
plugin.ffmpeg.ffmpeg.thumbnail.config.size.name=Dimensione
plugin.ffmpeg.ffmpeg.thumbnail.config.size.description=In pixel, del lato lungo della miniatura; un\u2019immagine pi\u00f9 piccola non viene ingrandita
plugin.ffmpeg.ffmpeg.thumbnail.config.timeoutSeconds.name=Limite di tempo (secondi)
plugin.ffmpeg.ffmpeg.thumbnail.config.timeoutSeconds.description=Per un file; oltre, ffmpeg viene fermato e l\u2019elemento \u00e8 in errore. 0: nessun limite.
plugin.ffmpeg.ffmpeg.thumbnail.config.ffmpegPath.name=Percorso di ffmpeg
plugin.ffmpeg.ffmpeg.thumbnail.config.ffmpegPath.description=Il ffmpeg da usare: il suo percorso, o il suo nome nel PATH. Vuoto: la copia scaricata, altrimenti ffmpeg del PATH.
