plugin.ffmpeg.ffmpeg.video.config.timeoutSeconds.description=Per un video; oltre, ffmpeg viene fermato e l\u2019elemento \u00e8 in errore. Un lungo video 4K codificato dal processore pu\u00f2 richiedere di pi\u00f9. 0: nessun limite.
plugin.ffmpeg.ffmpeg.video.config.ffmpegPath.name=Percorso di ffmpeg
plugin.ffmpeg.ffmpeg.video.config.ffmpegPath.description=Il ffmpeg da usare: il suo percorso, o il suo nome nel PATH. Vuoto: la copia scaricata, altrimenti ffmpeg del PATH.
