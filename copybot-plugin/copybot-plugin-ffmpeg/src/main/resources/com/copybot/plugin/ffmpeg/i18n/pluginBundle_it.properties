plugin.ffmpeg.ffmpeg.video.name=Comprimi un video (ffmpeg)
plugin.ffmpeg.ffmpeg.video.description=Transcodifica ogni video in MP4 (H.265 per impostazione predefinita) con il processore o la scheda grafica, ridotto se richiesto; metadati e data vengono conservati. Gli altri file passano invariati.
plugin.ffmpeg.ffmpeg.video.config.codec.name=Codec
plugin.ffmpeg.ffmpeg.video.config.codec.description=H.265 (pi\u00f9 piccolo, letto dai dispositivi recenti) o H.264 (letto ovunque)
plugin.ffmpeg.ffmpeg.video.config.codec.value.h265=H.265 (HEVC)
plugin.ffmpeg.ffmpeg.video.config.codec.value.h264=H.264 (AVC)
plugin.ffmpeg.ffmpeg.video.config.quality.name=Qualit\u00e0
plugin.ffmpeg.ffmpeg.video.config.quality.description=Alta: file pi\u00f9 grandi; file piccolo: perdita visibile
plugin.ffmpeg.ffmpeg.video.config.quality.value.high=Alta
plugin.ffmpeg.ffmpeg.video.config.quality.value.medium=Media
plugin.ffmpeg.ffmpeg.video.config.quality.value.small=File piccolo
plugin.ffmpeg.ffmpeg.video.config.maxHeight.name=Altezza massima
plugin.ffmpeg.ffmpeg.video.config.maxHeight.description=In pixel (es. 1080), del video come viene mostrato (anche un video verticale: la sua altezza \u00e8 allora il lato lungo): un video pi\u00f9 alto viene ridotto, mantenendo le proporzioni; mai ingrandito. Vuoto: nessuna riduzione.
plugin.ffmpeg.ffmpeg.video.config.audio.name=Audio
plugin.ffmpeg.ffmpeg.video.config.audio.description=AAC a 160 kb/s, o l\u2019audio copiato cos\u00ec com\u2019\u00e8
