plugin.ffmpeg.ffmpeg.video.config.audio.value.copy=Copiato cos\u00ec com\u2019\u00e8
plugin.ffmpeg.ffmpeg.video.config.encoder.name=Codificatore
plugin.ffmpeg.ffmpeg.video.config.encoder.description=Automatico: il primo codificatore della scheda grafica che funziona qui, altrimenti il processore. Un codificatore della scheda che non funziona viene sostituito dal processore.
plugin.ffmpeg.ffmpeg.video.config.encoder.value.auto=Automatico
