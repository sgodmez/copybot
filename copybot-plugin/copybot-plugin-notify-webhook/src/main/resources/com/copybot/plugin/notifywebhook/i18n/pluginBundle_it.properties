plugin.notify-webhook.name=Notifica via webhook
plugin.notify-webhook.description=Comunica a un servizio web l'esito di un run alla sua fine: ntfy, Discord, Slack, Telegram o qualsiasi webhook JSON.

plugin.notify-webhook.webhook.send.name=Invia un webhook
plugin.notify-webhook.webhook.send.description=Invia l'esito del run a un indirizzo web (HTTP POST) quando termina. Un errore \u00e8 un avviso del run.
plugin.notify-webhook.webhook.send.config.url.name=Indirizzo
plugin.notify-webhook.webhook.send.config.url.description=L'indirizzo a cui inviare; pu\u00f2 contenere un segreto, come il token di un bot Telegram: ${secret:nome}
plugin.notify-webhook.webhook.send.config.preset.name=Servizio
plugin.notify-webhook.webhook.send.config.preset.description=La forma del messaggio: json (tutto l'esito), ntfy, discord, slack o telegram
plugin.notify-webhook.webhook.send.config.preset.value.json=JSON (tutto l'esito)
plugin.notify-webhook.webhook.send.config.preset.value.ntfy=ntfy
plugin.notify-webhook.webhook.send.config.preset.value.discord=Discord
plugin.notify-webhook.webhook.send.config.preset.value.slack=Slack
plugin.notify-webhook.webhook.send.config.preset.value.telegram=Telegram
plugin.notify-webhook.webhook.send.config.headers.name=Intestazioni
plugin.notify-webhook.webhook.send.config.headers.description=Una per riga, nella forma Nome: valore (es. Authorization: Bearer ${secret:nome}); sostituiscono le intestazioni del servizio
plugin.notify-webhook.webhook.send.config.body.name=Messaggio
plugin.notify-webhook.webhook.send.config.body.description=Un modello che sostituisce il messaggio del servizio; {pipeline} {outcome} {written} {skipped} {errors} {duration} {summary} {output:chiave}. Vuoto: il messaggio del servizio.

plugin.notify-webhook.webhook.error.url-missing=webhook.send: l\u2019indirizzo manca
plugin.notify-webhook.webhook.error.url-invalid=webhook.send: l\u2019indirizzo non \u00e8 valido
plugin.notify-webhook.webhook.error.url-scheme=webhook.send: l\u2019indirizzo deve essere un indirizzo http o https
plugin.notify-webhook.webhook.error.preset-unknown=webhook.send: servizio sconosciuto "{0}"
plugin.notify-webhook.webhook.error.header-line=webhook.send: l''intestazione {0} non \u00e8 nella forma Nome: valore
plugin.notify-webhook.webhook.error.header-invalid=webhook.send: l''intestazione "{0}" non \u00e8 valida
plugin.notify-webhook.webhook.error.interrupted=webhook {0}: interrotto (tempo scaduto o annullamento)
plugin.notify-webhook.webhook.error.io=webhook {0}: la richiesta \u00e8 fallita ({1})
plugin.notify-webhook.webhook.error.status=webhook {0} ha risposto HTTP {1}
plugin.notify-webhook.webhook.error.status-body=webhook {0} ha risposto HTTP {1}: {2}
