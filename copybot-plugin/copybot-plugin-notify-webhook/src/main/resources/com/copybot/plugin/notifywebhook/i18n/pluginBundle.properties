plugin.notify-webhook.name=Webhook notification
plugin.notify-webhook.description=Tells a web service the result of a run at its end: ntfy, Discord, Slack, Telegram or any JSON webhook.

plugin.notify-webhook.webhook.send.name=Send a webhook
plugin.notify-webhook.webhook.send.description=Sends the result of the run to a web address (HTTP POST) when it ends. A failure is a warning of the run.
plugin.notify-webhook.webhook.send.config.url.name=Address
plugin.notify-webhook.webhook.send.config.url.description=The address to post to; it may hold a secret such as a Telegram bot token: ${secret:name}
plugin.notify-webhook.webhook.send.config.preset.name=Service
plugin.notify-webhook.webhook.send.config.preset.description=The shape of the message: json (the whole result), ntfy, discord, slack or telegram
plugin.notify-webhook.webhook.send.config.preset.value.json=JSON (the whole result)
plugin.notify-webhook.webhook.send.config.preset.value.ntfy=ntfy
plugin.notify-webhook.webhook.send.config.preset.value.discord=Discord
plugin.notify-webhook.webhook.send.config.preset.value.slack=Slack
plugin.notify-webhook.webhook.send.config.preset.value.telegram=Telegram
plugin.notify-webhook.webhook.send.config.headers.name=Headers
plugin.notify-webhook.webhook.send.config.headers.description=One per line, as Name: value (e.g. Authorization: Bearer ${secret:name}); they replace the headers of the service
plugin.notify-webhook.webhook.send.config.body.name=Message
plugin.notify-webhook.webhook.send.config.body.description=A template replacing the message of the service; {pipeline} {outcome} {written} {skipped} {errors} {duration} {summary} {output:key}. Empty: the message of the service.

plugin.notify-webhook.webhook.error.url-missing=webhook.send: the address is missing
plugin.notify-webhook.webhook.error.url-invalid=webhook.send: the address is not valid
plugin.notify-webhook.webhook.error.url-scheme=webhook.send: the address must be an http or https one
plugin.notify-webhook.webhook.error.preset-unknown=webhook.send: unknown service "{0}"
plugin.notify-webhook.webhook.error.header-line=webhook.send: header {0} is not of the form Name: value
plugin.notify-webhook.webhook.error.header-invalid=webhook.send: the header "{0}" is not valid
plugin.notify-webhook.webhook.error.interrupted=webhook {0}: interrupted (time limit or cancellation)
plugin.notify-webhook.webhook.error.io=webhook {0}: the request failed ({1})
plugin.notify-webhook.webhook.error.status=webhook {0} answered HTTP {1}
plugin.notify-webhook.webhook.error.status-body=webhook {0} answered HTTP {1}: {2}
