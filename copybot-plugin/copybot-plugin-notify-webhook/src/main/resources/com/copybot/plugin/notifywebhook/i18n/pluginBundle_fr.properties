plugin.notify-webhook.name=Notification par webhook
plugin.notify-webhook.description=Annonce le bilan d'un run \u00e0 un service web \u00e0 sa fin : ntfy, Discord, Slack, Telegram ou n'importe quel webhook JSON.

plugin.notify-webhook.webhook.send.name=Envoyer un webhook
plugin.notify-webhook.webhook.send.description=Envoie le bilan du run \u00e0 une adresse web (HTTP POST) quand il se termine. Un \u00e9chec est un avertissement du run.
plugin.notify-webhook.webhook.send.config.url.name=Adresse
plugin.notify-webhook.webhook.send.config.url.description=L'adresse o\u00f9 poster ; elle peut contenir un secret, tel le jeton d'un bot Telegram : ${secret:nom}
plugin.notify-webhook.webhook.send.config.preset.name=Service
plugin.notify-webhook.webhook.send.config.preset.description=La forme du message : json (tout le bilan), ntfy, discord, slack ou telegram
plugin.notify-webhook.webhook.send.config.preset.value.json=JSON (tout le bilan)
plugin.notify-webhook.webhook.send.config.preset.value.ntfy=ntfy
plugin.notify-webhook.webhook.send.config.preset.value.discord=Discord
plugin.notify-webhook.webhook.send.config.preset.value.slack=Slack
plugin.notify-webhook.webhook.send.config.preset.value.telegram=Telegram
plugin.notify-webhook.webhook.send.config.headers.name=En-t\u00eates
plugin.notify-webhook.webhook.send.config.headers.description=Un par ligne, sous la forme Nom: valeur (ex. Authorization: Bearer ${secret:nom}) ; ils remplacent les en-t\u00eates du service
plugin.notify-webhook.webhook.send.config.body.name=Message
plugin.notify-webhook.webhook.send.config.body.description=Un gabarit rempla\u00e7ant le message du service ; {pipeline} {outcome} {written} {skipped} {errors} {duration} {summary} {output:cl\u00e9}. Vide : le message du service.

plugin.notify-webhook.webhook.error.url-missing=webhook.send : l\u2019adresse est absente
plugin.notify-webhook.webhook.error.url-invalid=webhook.send : l\u2019adresse n\u2019est pas valide
plugin.notify-webhook.webhook.error.url-scheme=webhook.send : l\u2019adresse doit \u00eatre une adresse http ou https
plugin.notify-webhook.webhook.error.preset-unknown=webhook.send : service inconnu "{0}"
plugin.notify-webhook.webhook.error.header-line=webhook.send : l''en-t\u00eate {0} n''est pas de la forme Nom: valeur
plugin.notify-webhook.webhook.error.header-invalid=webhook.send : l''en-t\u00eate "{0}" n''est pas valide
plugin.notify-webhook.webhook.error.interrupted=webhook {0} : interrompu (d\u00e9lai ou annulation)
plugin.notify-webhook.webhook.error.io=webhook {0} : la requ\u00eate a \u00e9chou\u00e9 ({1})
plugin.notify-webhook.webhook.error.status=webhook {0} a r\u00e9pondu HTTP {1}
plugin.notify-webhook.webhook.error.status-body=webhook {0} a r\u00e9pondu HTTP {1} : {2}
