plugin.archive.name=Archive
plugin.archive.description=At the end of a run, zips the files it wrote with a SHA256SUMS manifest, or writes the manifest alone.

plugin.archive.archive.zip.name=Archive the written files
plugin.archive.archive.zip.description=Writes a ZIP of the files written by the run with a SHA256SUMS manifest, or the manifest alone. Publishes archive.path.
plugin.archive.archive.zip.config.target.name=Archive file
plugin.archive.archive.zip.config.target.description=The file to write; {date} (yyyy-MM-dd), {time} (HHmmss) and {pipeline} are replaced
plugin.archive.archive.zip.config.content.name=Content
plugin.archive.archive.zip.config.content.description=zip: the files and their SHA256SUMS manifest; manifest: the SHA256SUMS file alone
plugin.archive.archive.zip.config.content.value.zip=ZIP of the files with SHA256SUMS
plugin.archive.archive.zip.config.content.value.manifest=SHA256SUMS only
plugin.archive.archive.zip.config.includeSkipped.name=Include the skipped files
plugin.archive.archive.zip.config.includeSkipped.description=Also archive the targets of the items skipped because they already existed
plugin.archive.archive.zip.config.baseFolder.name=Base folder
plugin.archive.archive.zip.config.baseFolder.description=The paths in the archive are relative to this folder. Empty: the common directory of the files.

plugin.archive.archive.error.target-missing=archive.zip: the archive file is missing
plugin.archive.archive.error.target-invalid=archive.zip: the archive file is not a valid path
plugin.archive.archive.error.content-unknown=archive.zip: unknown content "{0}"
plugin.archive.archive.error.interrupted=archive.zip: interrupted (time limit or cancellation), nothing was written
plugin.archive.archive.error.io=archive.zip: writing {0} failed ({1})
plugin.archive.archive.info.no-file=archive.zip: no file was written by this run, no archive produced
plugin.archive.archive.warn.outside=archive.zip: {0} is outside the base folder {1}, left out of the archive
plugin.archive.archive.warn.unreadable=archive.zip: {0} no longer exists or cannot be read, left out of the archive
plugin.archive.archive.info.renamed=archive.zip: {0} already exists, the archive was written as {1}
plugin.archive.archive.warn.reserved=archive.zip: {0} is named {1} like the manifest of the archive, left out of the archive
